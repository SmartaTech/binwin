<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5-Step Donut Chart Infographic</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f7f9fc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .chart-container {
      position: relative;
      width: 100%;
      max-width: 650px;
      height: auto;
      aspect-ratio: 1 / 1;
    }

    #donutChart {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Center Text and Icon Styling */
    .center-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      width: 130px;
      pointer-events: none;
    }

    .center-icon {
      width: 36px;
      height: 36px;
      margin-bottom: 4px;
    }

    .center-title {
      font-size: 14px;
      font-weight: 700;
      color: #2b5b84;
      line-height: 1.2;
    }

    /* Slice styling */
    .slice {
      transition: transform 0.2s ease, opacity 0.2s ease;
      cursor: pointer;
    }

    .slice:hover {
      opacity: 0.9;
      filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.15));
    }

    .slice-text {
      font-size: 22px;
      font-weight: 800;
      fill: #ffffff;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    .pointer-line {
      stroke-width: 2;
      stroke-dasharray: 4 2;
    }

    .label-text {
      font-size: 11px;
      fill: #555555;
      font-weight: 500;
    }
  </style>
</head>
